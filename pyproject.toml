[project]
name = "constraintbench-replication"
version = "0.1.0"
description = "Independent replication and extension of ConstraintBench (arXiv:2602.22465): can LLMs solve constrained optimization problems directly?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "google-genai>=2.29.0",
    "gurobipy>=13.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.26.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
